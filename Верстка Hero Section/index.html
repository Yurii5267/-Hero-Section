<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid container-sm mt-5">

        <h1 class="text-center mb-5 text-dark">Modern Bootstrap Banners</h1>

        <section class="hero-saas shadow">

            <div class="container">

                <div class="row align-items-center g-4">

                    <div class="col-12 col-lg-7 text-center text-lg-start">
                        <h2 class="display-4 fw-bold mb-3">Transform Your Ideas into Real Products!</h2>
                        <p class="lead mb-4">Our innovative solution provides tools for rapid development, scalability, and success.</p>

                        <div class="container">
                            <div class="row g-2 mb-4">
                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center me-0">Rapid Launch</div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center me-0">Scalability</div>
                                </div>
                                <div class="col-6 col-md-4">
                                    <div class="feature-badge w-100 text-center me-0">Reliable Support</div>
                                </div>
                            </div>
                        </div>

                        <a href="#" class="btn btn-lg btn-light rounded-pill px-4 shadow">Get Started for Free</a>
                    </div>

                    <div class="col-12 col-lg-5">
                        <div class="illustration-placeholder text-center">
                            <img src="illustration.svg" alt="Your Illustration Here" class="img-fluid rounded">
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>

</body>
</html>
